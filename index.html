<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LINK BOLD CANVAS - POS Kanvas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc2626">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .tab-active { background-color: #dc2626; color: #ffffff; font-weight: 700; }
  </style>
</head>
<body class="pb-24">
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-extrabold tracking-tight text-white">LINK BOLD <span class="text-red-500">CANVAS</span></h1>
      <p class="text-xs text-slate-400">Sales: <strong class="text-slate-200">Denis</strong> • Rute Selatan</p>
    </div>
    <div class="text-right">
      <span id="tglHariIni" class="text-[11px] bg-slate-800 text-slate-300 px-2 py-1 rounded-md"></span>
    </div>
  </header>

  <section class="grid grid-cols-2 gap-2 p-3">
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3">
      <p class="text-[11px] text-slate-400">Total Penjualan Hari Ini</p>
      <p id="statOmzet" class="text-base font-bold text-emerald-400 mt-0.5">Rp 0</p>
    </div>
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3">
      <p class="text-[11px] text-slate-400">Total Piutang Warung</p>
      <p id="statPiutang" class="text-base font-bold text-amber-400 mt-0.5">Rp 0</p>
    </div>
  </section>

  <main class="px-3">
    <div id="view-kasir" class="space-y-3">
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3 space-y-2.5">
        <label class="block text-xs font-semibold text-slate-300">Pilih Warung Tujuan</label>
        <div class="flex gap-2">
          <select id="selectWarung" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></select>
          <button onclick="tambahWarungBaru()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-semibold shrink-0">+ Warung</button>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Metode Bayar</label>
            <select id="metodeBayar" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white">
              <option value="TUNAI">Tunai / Cash</option>
              <option value="TRANSFER">Transfer</option>
              <option value="BON">Bon / Piutang</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Bonus Promo (Bks)</label>
            <input id="inputBonus" type="number" min="0" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white">
          </div>
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Katalog Varian Link Bold (Slop / Bks)</h2>
        <div id="listProdukKasir" class="space-y-2"></div>
      </div>

      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 space-y-2">
        <div class="flex justify-between text-sm">
          <span class="text-slate-400">Total Nota:</span>
          <span id="totalKeranjang" class="font-extrabold text-white">Rp 0</span>
        </div>
        <button onclick="simpanTransaksi()" class="w-full bg-red-600 hover:bg-red-500 active:scale-[0.99] text-white font-bold py-2.5 rounded-lg text-sm shadow-lg shadow-red-900/30">
          Simpan Transaksi & Cetak Nota WA
        </button>
      </div>
    </div>

    <div id="view-stok" class="hidden space-y-3">
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Stok Muatan Mobil Kanvas</h2>
          <button onclick="isiUlangStok()" class="text-xs bg-emerald-600 px-2.5 py-1 rounded-md font-semibold">+ Muat Stok</button>
        </div>
        <div id="listStokMobil" class="space-y-2"></div>
      </div>
    </div>

    <div id="view-warung" class="hidden space-y-3">
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Daftar Warung & Catatan Bon</h2>
          <button onclick="tambahWarungBaru()" class="text-xs bg-red-600 px-2.5 py-1 rounded-md font-semibold">+ Tambah</button>
        </div>
        <div id="listWarung" class="space-y-2"></div>
      </div>
    </div>

    <div id="view-rekap" class="hidden space-y-3">
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3 space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Rekap Setoran Harian</h2>
        <div id="ringkasanSetoran" class="text-xs space-y-1.5 bg-slate-900 p-3 rounded-lg border border-slate-800"></div>
        <button onclick="kirimRekapWA()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm">
          Kirim Rekap Setoran ke WhatsApp
        </button>
        <button onclick="resetHariBaru()" class="w-full bg-slate-800 border border-slate-700 text-slate-300 font-semibold py-2 rounded-lg text-xs">
          Tutup Buku / Mulai Hari Baru
        </button>
      </div>
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3">
        <h3 class="text-xs font-bold text-slate-400 mb-2">Riwayat Nota Hari Ini</h3>
        <div id="listRiwayat" class="space-y-2 text-xs"></div>
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 grid grid-cols-4 p-1.5 gap-1 z-30">
    <button onclick="switchTab('kasir')" id="tab-kasir" class="tab-active py-2 rounded-lg text-xs">Kasir</button>
    <button onclick="switchTab('stok')" id="tab-stok" class="text-slate-400 py-2 rounded-lg text-xs">Stok Mobil</button>
    <button onclick="switchTab('warung')" id="tab-warung" class="text-slate-400 py-2 rounded-lg text-xs">Warung</button>
    <button onclick="switchTab('rekap')" id="tab-rekap" class="text-slate-400 py-2 rounded-lg text-xs">Setoran</button>
  </nav>

  <script>
    const defaultData = {
      produk: [
        { id: 'lb12', nama: 'Link Bold 12 (Slop)', harga: 145000, stok: 25, bs: 0 },
        { id: 'lb16', nama: 'Link Bold 16 (Slop)', harga: 185000, stok: 30, bs: 0 },
        { id: 'lb20', nama: 'Link Bold 20 (Slop)', harga: 225000, stok: 20, bs: 0 },
        { id: 'lbm16', nama: 'Link Bold Mild 16 (Slop)', harga: 180000, stok: 15, bs: 0 }
      ],
      warung: [
        { id: 'w1', nama: 'Warung Bu Haji Siti - Cipanas', piutang: 0 },
        { id: 'w2', nama: 'Toko Berkah Jaya - Pacet', piutang: 185000 },
        { id: 'w3', nama: 'Warung Kang Asep - Mariwati', piutang: 0 }
      ],
      transaksi: [],
      bonusKeluar: 0
    };

    let state = JSON.parse(localStorage.getItem('linkbold_pos_data')) || defaultData;
    let keranjang = {};

    function saveState() {
      localStorage.setItem('linkbold_pos_data', JSON.stringify(state));
      renderAll();
    }

    function rupiah(n) {
      return 'Rp ' + (n || 0).toLocaleString('id-ID');
    }

    function switchTab(tab) {
      ['kasir', 'stok', 'warung', 'rekap'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById('tab-' + t);
        btn.className = t === tab ? 'tab-active py-2 rounded-lg text-xs' : 'text-slate-400 py-2 rounded-lg text-xs';
      });
    }

    function ubahQty(id, delta) {
      const prod = state.produk.find(p => p.id === id);
      const next = (keranjang[id] || 0) + delta;
      if (next < 0) return;
      if (next > prod.stok) { alert('Stok mobil tidak mencukupi!'); return; }
      keranjang[id] = next;
      renderKasir();
    }

    function renderKasir() {
      const sel = document.getElementById('selectWarung');
      const prevVal = sel.value;
      sel.innerHTML = state.warung.map(w => `<option value="${w.id}">${w.nama}</option>`).join('');
      if (prevVal) sel.value = prevVal;

      let total = 0;
      document.getElementById('listProdukKasir').innerHTML = state.produk.map(p => {
        const qty = keranjang[p.id] || 0;
        total += qty * p.harga;
        return `
          <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 p-2.5 rounded-lg">
            <div>
              <p class="text-xs font-bold text-white">${p.nama}</p>
              <p class="text-[11px] text-slate-400">${rupiah(p.harga)} • Sisa: <span class="text-emerald-400 font-semibold">${p.stok}</span></p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="ubahQty('${p.id}', -1)" class="w-7 h-7 rounded-md bg-slate-800 text-white font-bold">-</button>
              <span class="w-6 text-center text-xs font-bold">${qty}</span>
              <button onclick="ubahQty('${p.id}', 1)" class="w-7 h-7 rounded-md bg-red-600 text-white font-bold">+</button>
            </div>
          </div>`;
      }).join('');
      document.getElementById('totalKeranjang').textContent = rupiah(total);
    }

    function simpanTransaksi() {
      const items = state.produk.filter(p => (keranjang[p.id] || 0) > 0).map(p => ({
        id: p.id, nama: p.nama, qty: keranjang[p.id], harga: p.harga, subtotal: keranjang[p.id] * p.harga
      }));
      if (items.length === 0) { alert('Pilih minimal 1 produk!'); return; }

      const warungId = document.getElementById('selectWarung').value;
      const warung = state.warung.find(w => w.id === warungId);
      const metode = document.getElementById('metodeBayar').value;
      const bonus = parseInt(document.getElementById('inputBonus').value) || 0;
      const total = items.reduce((s, i) => s + i.subtotal, 0);

      items.forEach(it => {
        const p = state.produk.find(x => x.id === it.id);
        p.stok -= it.qty;
      });
      if (metode === 'BON') warung.piutang += total;
      state.bonusKeluar += bonus;

      const trx = {
        waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        warung: warung.nama, metode, bonus, total, items
      };
      state.transaksi.unshift(trx);
      keranjang = {};
      document.getElementById('inputBonus').value = 0;
      saveState();

      const detailText = items.map(i => `- ${i.nama} x${i.qty} = ${rupiah(i.subtotal)}`).join('\n');
      const pesanWA = `*NOTA LINK BOLD CANVAS*\nWarung: ${trx.warung}\nWaktu: ${trx.waktu}\nMetode: ${trx.metode}\n${detailText}\nBonus: ${trx.bonus} Bks\n*Total: ${rupiah(trx.total)}*\nSales: Denis (Rute Selatan)`;
      if (confirm('Transaksi tersimpan! Kirim nota ke WhatsApp sekarang?')) {
        window.open('https://wa.me/?text=' + encodeURIComponent(pesanWA), '_blank');
      }
    }

    function renderStok() {
      document.getElementById('listStokMobil').innerHTML = state.produk.map(p => `
        <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg flex justify-between items-center">
          <div>
            <p class="text-xs font-bold text-white">${p.nama}</p>
            <p class="text-[11px] text-slate-400">Bagus: <span class="text-emerald-400 font-bold">${p.stok}</span> | Retur/BS: <span class="text-red-400 font-bold">${p.bs}</span></p>
          </div>
          <div class="flex gap-1.5">
            <button onclick="tambahBS('${p.id}')" class="text-[11px] bg-amber-600/20 text-amber-300 border border-amber-600/40 px-2 py-1 rounded">+ BS</button>
          </div>
        </div>
      `).join('');
    }

    function tambahBS(id) {
      const jml = parseInt(prompt('Jumlah retur / BS masuk ke mobil:'));
      if (jml > 0) {
        const p = state.produk.find(x => x.id === id);
        p.bs += jml;
        saveState();
      }
    }

    function isiUlangStok() {
      state.produk.forEach(p => {
        const tambah = parseInt(prompt(`Tambah stok bagus untuk ${p.nama} (Saat ini: ${p.stok}):`, '0'));
        if (tambah > 0) p.stok += tambah;
      });
      saveState();
    }

    function renderWarung() {
      document.getElementById('listWarung').innerHTML = state.warung.map(w => `
        <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg flex justify-between items-center">
          <div>
            <p class="text-xs font-bold text-white">${w.nama}</p>
            <p class="text-[11px] ${w.piutang > 0 ? 'text-amber-400 font-semibold' : 'text-slate-400'}">Piutang: ${rupiah(w.piutang)}</p>
          </div>
          ${w.piutang > 0 ? `<button onclick="bayarBon('${w.id}')" class="text-[11px] bg-emerald-600 text-white px-2.5 py-1 rounded font-semibold">Lunasi</button>` : '<span class="text-[10px] text-emerald-500">Lunas</span>'}
        </div>
      `).join('');
    }

    function bayarBon(id) {
      const w = state.warung.find(x => x.id === id);
      const bayar = parseInt(prompt(`Nominal pembayaran bon ${w.nama} (Total: ${w.piutang}):`, w.piutang));
      if (bayar > 0) {
        w.piutang = Math.max(0, w.piutang - bayar);
        saveState();
      }
    }

    function tambahWarungBaru() {
      const nama = prompt('Masukkan Nama Warung & Alamat:');
      if (nama && nama.trim()) {
        state.warung.push({ id: 'w' + Date.now(), nama: nama.trim(), piutang: 0 });
        saveState();
      }
    }

    function renderRekap() {
      const tunai = state.transaksi.filter(t => t.metode === 'TUNAI').reduce((s, t) => s + t.total, 0);
      const tf = state.transaksi.filter(t => t.metode === 'TRANSFER').reduce((s, t) => s + t.total, 0);
      const bon = state.transaksi.filter(t => t.metode === 'BON').reduce((s, t) => s + t.total, 0);
      const omzet = tunai + tf + bon;
      const totalPiutang = state.warung.reduce((s, w) => s + w.piutang, 0);

      document.getElementById('statOmzet').textContent = rupiah(omzet);
      document.getElementById('statPiutang').textContent = rupiah(totalPiutang);

      document.getElementById('ringkasanSetoran').innerHTML = `
        <div class="flex justify-between"><span class="text-slate-400">Setoran Tunai (Cash):</span><span class="font-bold text-emerald-400">${rupiah(tunai)}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Transfer Masuk:</span><span class="font-bold text-sky-400">${rupiah(tf)}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Penjualan Bon Baru:</span><span class="font-bold text-amber-400">${rupiah(bon)}</span></div>
        <div class="flex justify-between border-t border-slate-800 pt-1.5"><span class="text-slate-300 font-semibold">Total Omzet Hari Ini:</span><span class="font-extrabold text-white">${rupiah(omzet)}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Total Bonus Promo Keluar:</span><span class="text-slate-200">${state.bonusKeluar} Bks</span></div>
      `;

      document.getElementById('listRiwayat').innerHTML = state.transaksi.length === 0
        ? '<p class="text-slate-500">Belum ada transaksi hari ini.</p>'
        : state.transaksi.map(t => `
          <div class="bg-slate-900 p-2 rounded border border-slate-800 flex justify-between">
            <div><span class="font-bold text-white">${t.warung}</span> <span class="text-slate-400">(${t.waktu})</span></div>
            <div class="text-right"><span class="font-bold text-emerald-400">${rupiah(t.total)}</span> <span class="text-[10px] text-slate-400">[${t.metode}]</span></div>
          </div>`).join('');
    }

    function kirimRekapWA() {
      const tunai = state.transaksi.filter(t => t.metode === 'TUNAI').reduce((s, t) => s + t.total, 0);
      const tf = state.transaksi.filter(t => t.metode === 'TRANSFER').reduce((s, t) => s + t.total, 0);
      const bon = state.transaksi.filter(t => t.metode === 'BON').reduce((s, t) => s + t.total, 0);
      const sisaStok = state.produk.map(p => `- ${p.nama}: ${p.stok} (BS: ${p.bs})`).join('\n');
      const teks = `*REKAP SETORAN KANVAS LINK BOLD*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\nSales: Denis (Rute Selatan)\n\n*Keuangan:*\n- Cash Setor: ${rupiah(tunai)}\n- Transfer: ${rupiah(tf)}\n- Bon Baru: ${rupiah(bon)}\n- Total Omzet: ${rupiah(tunai + tf + bon)}\n- Bonus Keluar: ${state.bonusKeluar} Bks\n\n*Sisa Stok Mobil:*\n${sisaStok}`;
      window.open('https://wa.me/?text=' + encodeURIComponent(teks), '_blank');
    }

    function resetHariBaru() {
      if (confirm('Reset transaksi harian dan bonus untuk mulai hari baru? (Data warung & piutang tetap tersimpan)')) {
        state.transaksi = [];
        state.bonusKeluar = 0;
        saveState();
      }
    }

    function renderAll() {
      document.getElementById('tglHariIni').textContent = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
      renderKasir();
      renderStok();
      renderWarung();
      renderRekap();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    renderAll();
  </script>
</body>
</html>
